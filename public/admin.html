<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Send Notifications</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-wrap">
    <header>
      <img src="jinnie-chats.png" alt="logo" class="logo">
      <h1>Admin Notifications</h1>
    </header>

    <div class="card">
      <label>Notification Title</label>
      <input id="title" placeholder="Title (e.g. 🔥 Special Offer)">

      <label>Message</label>
      <textarea id="message" placeholder="Message body"></textarea>

      <label>Admin Secret</label>
      <input id="secret" type="password" placeholder="Enter admin secret">

      <button id="send">Send Notification</button>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
